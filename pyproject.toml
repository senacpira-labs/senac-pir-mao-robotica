[project]
name = "senac-pir-mao-robotica"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=1.1.1",
    "opencv-python>=5.0.0.93",
    "pyfirmata2>=2.5.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
lint = "ruff check ."
fix = "ruff check . --fix"
format = "ruff format ."
check = "ruff format --check ."
